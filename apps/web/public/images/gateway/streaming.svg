<svg width="424" height="336" viewBox="0 0 424 336" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
<style>
.streaming-animated-line {
    stroke-dasharray: 0.1 5; 
    stroke-dashoffset: 0;
    animation: streaming-dash-flow 300ms linear infinite;
}

.streaming-animated-line:nth-child(even) {
    animation-direction: reverse;
}

@keyframes streaming-dash-flow {
    0% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: 5;
    }
  }

.streaming-thinking-dot {
    animation: streaming-thinking-dot-pulse 1000ms linear infinite;
}

.streaming-thinking-dot:nth-child(2) { animation-delay: -250ms; }
.streaming-thinking-dot:nth-child(3) { animation-delay: -500ms; }
.streaming-thinking-dot:nth-child(4) { animation-delay: -750ms; }

@keyframes streaming-thinking-dot-pulse {
    0%, 70%, 100% {
        opacity: 0.2;
    }
    50% {
        opacity: 1;
    }
}

.streaming-content {
    animation: streaming-scroll 4s linear infinite;
}

@keyframes streaming-scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-190px); }
}

@media (prefers-reduced-motion: reduce) {
    .streaming-content {
        animation: none;
    }
    .streaming-thinking-dot {
        animation: none;
    }
    .streaming-animated-line {
        animation: none;
    }
}

</style>

