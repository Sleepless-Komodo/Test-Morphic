<svg width="424" height="338" viewBox="0 0 424 338" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
<style>
.agents-animated-line {
    stroke-dasharray: 0.1 5; 
    stroke-dashoffset: 0;
    animation: agents-dash-flow 300ms linear infinite;
}

.agents-animated-line:nth-child(even) {
    animation-direction: reverse;
}

@keyframes agents-dash-flow {
    0% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: 5;
    }
  }

.agents-thinking-dot {
    animation: agents-thinking-dot-pulse 1000ms linear infinite;
}

.agents-thinking-dot:nth-child(2) { animation-delay: -250ms; }
.agents-thinking-dot:nth-child(3) { animation-delay: -500ms; }
.agents-thinking-dot:nth-child(4) { animation-delay: -750ms; }

@keyframes agents-thinking-dot-pulse {
    0%, 70%, 100% {
        opacity: 0.2;
    }
    50% {
        opacity: 1;
    }
}

@media (prefers-reduced-motion: reduce) {
    .agents-animated-line {
        animation: none;
    }
    .agents-thinking-dot {
        animation: none;
    }
}
</style>
